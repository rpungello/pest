name: Build Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        php_version:
          - "8.0"
          - "8.1"
          - "8.2"
          - "8.3"
          - "8.4"
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image for PHP ${{ matrix.php_version }}
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          build-args: |
            PHP_VERSION=${{ matrix.php_version }}
          tags: pest-php:${{ matrix.php_version }}
          push: false
          load: true

      - name: Verify PCOV extension is installed
        run: |
          docker run --rm pest-php:${{ matrix.php_version }} php -m | grep pcov
